name: SkyVerse Checks

on:
  push:
    branches: [main, upgrade/economy-core-v2, upgrade/user-profile-system, upgrade/whatsapp-connection-recovery]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install FFmpeg test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg webp fonts-dejavu-core
      - name: Check media tools
        run: npm run check-media-tools
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run smoke test
        run: npm run smoke
