name: SkyVerse Checks

on:
  push:
    branches: [main, upgrade/economy-core-v2, upgrade/user-profile-system]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run smoke test
        run: npm run smoke
      - name: Run profile smoke test
        run: node src/diagnostics/profile-smoke.js
