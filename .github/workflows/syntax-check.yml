name: SkyVerse Syntax Check

on:
  push:
    branches: [main, fix/downloader-resilience]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test downloader fallback
        run: npm run smoke-downloader
