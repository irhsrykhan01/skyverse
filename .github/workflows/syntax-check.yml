name: SkyVerse Integration Checks

on:
  push:
    branches:
      - main
      - maintenance/integration-audit-2026-11
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install FFmpeg and WebP tools for media checks
        run: sudo apt-get update && sudo apt-get install -y ffmpeg webp fonts-dejavu-core
      - name: Validate media runtime capabilities
        run: npm run check-media-tools
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run command and integration smoke tests
        run: npm run smoke
      - name: Run downloader fallback tests
        run: npm run smoke-downloader
      - name: Diagnose Baileys newsletter compatibility
        continue-on-error: true
        run: npm run check-newsletter
